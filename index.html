<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieHub — Discover films & series</title>
    <meta name="description" content="MovieHub by DarkNova. Movies, series, and anime. Posters, plots, trailers, and a weekly anime board." />
    <meta name="theme-color" content="#07070b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark">MH</span>
        <span class="brand-text">MovieHub</span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/movies" data-nav="movies">Movies</a>
        <a href="#/tv" data-nav="tv">TV</a>
        <a href="#/anime" data-nav="anime">Anime</a>
        <a href="#/list" data-nav="list">My List</a>
      </nav>
      <form class="search" id="search-form" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search titles…" aria-label="Search movies and TV" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main id="app"></main>
    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" role="dialog" aria-modal="true"></div>
    </div>
    <footer class="site-foot">
      <p>Catalog and trailers. MovieHub does not host full films.</p>
    </footer>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
